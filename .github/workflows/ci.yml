name: Verify Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up patched Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install from committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Security and route smoke regression
        run: node scripts/batch2-smoke.mjs

      - name: P4.5 multilingual case-study release regression
        run: node scripts/p45-release-regression.mjs

      - name: IDA Labs chat API contract regression (mock provider; no billable requests)
        run: node scripts/ida-chat-contract.mjs

      - name: IDA consultation consent and SMTP guard regression (no live mail)
        run: node scripts/ida-consultation-regression.mjs
