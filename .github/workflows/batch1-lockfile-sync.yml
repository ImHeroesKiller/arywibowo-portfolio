name: Batch 1 P0 Lockfile Sync

on:
  push:
    branches:
      - fix/batch1-p0-20261023

permissions:
  contents: write

jobs:
  validate-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved repair branch
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Use patched Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'

      - name: Regenerate lockfile deterministically
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install and validate build
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run lint

      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync lockfile for patched Next.js 15 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
